<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Serrurier automobile à Nice">
  <circle cx="90" cy="90" r="90" fill="#EFAD42"/>
  <!-- Outer ring -->
  <circle cx="90" cy="90" r="54" fill="none" stroke="white" stroke-width="13"/>
  <!-- Spoke top -->
  <line x1="90" y1="90" x2="90" y2="38" stroke="white" stroke-width="11" stroke-linecap="round"/>
  <!-- Spoke bottom-right (120deg) -->
  <line x1="90" y1="90" x2="137" y2="117" stroke="white" stroke-width="11" stroke-linecap="round"/>
  <!-- Spoke bottom-left (240deg) -->
  <line x1="90" y1="90" x2="43" y2="117" stroke="white" stroke-width="11" stroke-linecap="round"/>
  <!-- Center hub -->
  <circle cx="90" cy="90" r="15" fill="white"/>
  <circle cx="90" cy="90" r="7" fill="#EFAD42"/>
</svg>
